[project]
name = "follow-robot"
version = "0.1.0"
description = "Reinforcement learning for 4-wheel Ackermann robot with RGB-D camera and 2D LiDAR"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=0.29.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "tensorboard>=2.16.0",
    "opencv-python-headless>=4.9.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pygame>=2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
ackbot-train-ppo = "rl_ws.train:main"
ackbot-harvest = "scripts.harvest_data:main"
ackbot-train-wm = "scripts.train_world_model:main"
ackbot-benchmark = "scripts.benchmark:main"
ackbot-view-gym = "scripts.view_gym_env:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rl_ws", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
