[project]
name = "follow-robot"
version = "0.1.0"
description = "Reinforcement learning for 4-wheel Ackermann robot with RGB-D camera and 2D LiDAR"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=0.29.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "tensorboard>=2.16.0",
    "opencv-python-headless>=4.9.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pygame>=2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
ackbot-visualize = "scripts.visualize_robot:main"
ackbot-test-env = "scripts.test_env_rollout:main"
ackbot-view-gym = "scripts.view_gym_env:main"
ackbot-train = "scripts.run_train:main"
ackbot-eval = "scripts.run_eval:main"
ackbot-harvest = "scripts.harvest_data:main"
ackbot-train-sigreg = "scripts.train_sigreg:main"
ackbot-train-vae = "scripts.train_vae:main"
ackbot-train-diffusion = "scripts.train_diffusion:main"
ackbot-train-reward = "scripts.train_reward_heads:main"
ackbot-eval-wm = "scripts.evaluate_comparative:main"
ackbot-mpc = "scripts.run_latent_mpc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rl_ws", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
