services:
  ackbot-sim:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ackbot-sim:jazzy-arm64
    container_name: ackbot_simulation
    shm_size: '2gb'
    environment:
      - DISPLAY=:1
      - ROS_DISTRO=jazzy
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - VNC_PASSWORD=ackbot2026
    volumes:
      - ..:/workspace
      - ./entrypoint.sh:/entrypoint.sh:ro
    ports:
      # Bound strictly to 127.0.0.1 (localhost only) to prevent local network exposure
      - "127.0.0.1:6080:6080"   # noVNC Web Desktop (Gazebo & RViz2 UI)
      - "127.0.0.1:8765:8765"   # Foxglove Studio WebSocket Bridge
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: bash
